<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <rect width="600" height="340" fill="white" stroke="#ccc"/>
  <text x="300" y="22" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Fig. 2.1 — Capacitor Discharge (9702/52/O/N/23)</text>
  <!-- CA CB in parallel? Series? Show both options -->
  <!-- Supply + switch -->
  <rect x="40" y="90" width="70" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="75" y="108" text-anchor="middle" font-size="8">DC</text>
  <text x="75" y="118" text-anchor="middle" font-size="8">Supply</text>
  <line x1="110" y1="105" x2="150" y2="105" stroke="black" stroke-width="1.5"/>
  <circle cx="155" cy="105" r="5" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="155" y="95" font-size="7">switch</text>
  <!-- capacitors CA CB -->
  <line x1="160" y1="105" x2="200" y2="105" stroke="black" stroke-width="1.5"/>
  <line x1="200" y1="85" x2="200" y2="125" stroke="black" stroke-width="2"/>
  <line x1="210" y1="85" x2="210" y2="125" stroke="black" stroke-width="2"/>
  <text x="205" y="145" font-size="8">C_A</text>
  <line x1="210" y1="105" x2="250" y2="105" stroke="black" stroke-width="1.5"/>
  <line x1="250" y1="85" x2="250" y2="125" stroke="black" stroke-width="2"/>
  <line x1="260" y1="85" x2="260" y2="125" stroke="black" stroke-width="2"/>
  <text x="255" y="145" font-size="8">C_B</text>
  <text x="230" y="76" font-size="7">combined C</text>
  <!-- resistor -->
  <line x1="260" y1="105" x2="300" y2="105" stroke="black" stroke-width="1.5"/>
  <rect x="300" y="95" width="60" height="20" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="330" y="108" text-anchor="middle" font-size="9">R</text>
  <!-- back to supply -->
  <line x1="360" y1="105" x2="400" y2="105" stroke="black" stroke-width="1.5"/>
  <line x1="400" y1="105" x2="400" y2="170" stroke="black" stroke-width="1.5"/>
  <line x1="400" y1="170" x2="75" y2="170" stroke="black" stroke-width="1.5"/>
  <line x1="75" y1="170" x2="75" y2="130" stroke="black" stroke-width="1.5"/>
  <!-- voltmeter across capacitors -->
  <line x1="200" y1="125" x2="200" y2="200" stroke="black" stroke-dasharray="4,3"/>
  <line x1="260" y1="125" x2="260" y2="200" stroke="black" stroke-dasharray="4,3"/>
  <rect x="180" y="200" width="100" height="35" fill="none" stroke="black"/>
  <text x="230" y="218" text-anchor="middle" font-size="10">V</text>
  <text x="230" y="229" text-anchor="middle" font-size="7">voltmeter</text>
  <!-- stopwatch -->
  <rect x="420" y="180" width="80" height="50" fill="none" stroke="black" rx="8"/>
  <text x="460" y="200" text-anchor="middle" font-size="8">Stopwatch</text>
  <text x="460" y="213" text-anchor="middle" font-size="9">t = fixed</text>
  <text x="460" y="225" text-anchor="middle" font-size="7">(record V at time t)</text>
  <line x1="230" y1="235" x2="420" y2="205" stroke="black" stroke-width="0.7" stroke-dasharray="3,3"/>
  <!-- notes -->
  <line x1="20" y1="275" x2="580" y2="275" stroke="black" stroke-width="1.5"/>
  <text x="300" y="295" text-anchor="middle" font-size="8" fill="#555">Different C_A, C_B combos → combined C calculated. At fixed t after opening switch, record V. Repeat 3× per C, mean.</text>
  <text x="300" y="310" text-anchor="middle" font-size="8" fill="#555">Plot ln V vs 1/C. Gradient = −t/R, intercept = ln(I₀R). Safety: shrouded leads, discharge before handling.</text>
</svg>
