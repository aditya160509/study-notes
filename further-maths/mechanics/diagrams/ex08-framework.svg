<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff; border-radius:8px;" font-family="system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
  </filter>
  <marker id="ab" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#1e293b"/>
  </marker>
  <marker id="ablue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
  </marker>
  <marker id="ared" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#dc2626"/>
  </marker>
  <marker id="agreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
  </marker>
  <marker id="aorange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
  </marker>
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
  <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>
</defs>
<rect x="20" y="20" width="460" height="360" fill="none" stroke="none" stroke-width="2.5"/>
<rect x="80" y="60" width="340" height="220" fill="url(#grad-blue)" stroke="#1e293b" stroke-width="3" filter="url(#shadow-sm)"/>
<line x1="60" y1="280" x2="60" y2="50" stroke="#1e293b" stroke-width="3.5" marker-end="url(#ab)"/>
<text x="55" y="45" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >x</text>
<line x1="80" y1="300" x2="430" y2="300" stroke="#1e293b" stroke-width="3.5" marker-end="url(#ab)"/>
<text x="435" y="300" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >y</text>
<circle cx="80" cy="60" r="6" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="80" y="48" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >A (0,0)</text>
<circle cx="420" cy="60" r="6" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="420" y="48" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >B (5,0)</text>
<circle cx="420" cy="280" r="6" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="420" y="302" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >C (5,3)</text>
<circle cx="80" cy="280" r="6" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="80" y="302" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >D (0,3)</text>
<rect x="85" y="65" width="50" height="25" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6" filter="url(#shadow-sm)"/>
<text x="110" y="82" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="normal" >2 kg</text>
<rect x="385" y="65" width="50" height="25" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6" filter="url(#shadow-sm)"/>
<text x="410" y="82" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="normal" >4 kg</text>
<rect x="385" y="250" width="50" height="25" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6" filter="url(#shadow-sm)"/>
<text x="410" y="267" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="normal" >7 kg</text>
<rect x="85" y="250" width="55" height="25" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6" filter="url(#shadow-sm)"/>
<text x="110" y="267" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="normal" >2.5 kg</text>
<text x="250" y="40" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" >AB = 5 m</text>
<text x="50" y="170" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" >AD = 3 m</text>
<text x="250" y="340" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Rectangular framework with masses</text>
</svg>