<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" style="background:#ffffff; border-radius:8px;" font-family="system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
  </filter>
  <marker id="ab" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#1e293b"/>
  </marker>
  <marker id="ablue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
  </marker>
  <marker id="ared" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#dc2626"/>
  </marker>
  <marker id="agreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
  </marker>
  <marker id="aorange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
  </marker>
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
  <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>
</defs>
<rect x="140" y="60" width="80" height="220" fill="url(#grad-blue)" stroke="#1e293b" stroke-width="3" filter="url(#shadow-sm)"/>
<text x="180" y="170" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" >2a × a</text>
<rect x="220" y="200" width="120" height="80" fill="url(#grad-warm)" stroke="#1e293b" stroke-width="3" filter="url(#shadow-sm)"/>
<text x="280" y="245" font-size="13" text-anchor="middle" fill="#d97706" font-weight="bold" >a × a</text>
<circle cx="140" cy="60" r="8" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="140" y="48" font-size="13" text-anchor="end" fill="#1e293b" font-weight="normal" >A (suspension)</text>
<circle cx="198" cy="118" r="7" fill="#dc2626" stroke="#1e293b" stroke-width="2"/>
<text x="206" y="122" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal" >G</text>
<line x1="140" y1="60" x2="198" y2="118" stroke="#16a34a" stroke-width="3.5" marker-end="url(#agreen)"/>
<line x1="198" y1="118" x2="198" y2="380" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4"/>
<text x="206" y="380" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="normal" >vertical</text>
<line x1="140" y1="60" x2="220" y2="60" stroke="#64748b" stroke-width="2"/>
<text x="250" y="56" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >AB (reference edge)</text>
<path d="M140.0,95.0 A35,35 0 0,0 105.0,60.0" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<text x="82" y="80" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold" >θ = 45°</text>
<rect x="120" y="395" width="280" height="35" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" rx="8"/>
<text x="260" y="418" font-size="13" text-anchor="middle" fill="#166534" font-weight="normal" >tan θ = x̄ / ȳ = (5a/6) / (5a/6) = 1  ⇒  θ = 45°</text>
<text x="240" y="435" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >L-shaped lamina suspended from A</text>
</svg>