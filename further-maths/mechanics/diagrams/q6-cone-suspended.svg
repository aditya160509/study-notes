<text x="210" y="60" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >C</text>
<circle cx="100" cy="70" r="8" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="90" y="60" font-size="14" text-anchor="end" fill="#1e293b" font-weight="normal" >B</text>
<circle cx="210" cy="155" r="7" fill="#dc2626" stroke="#1e293b" stroke-width="2"/>
<text x="210" y="145" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal" >G</text>
<line x1="100" y1="70" x2="100" y2="380" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5,4"/>
<text x="88" y="380" font-size="12" text-anchor="end" fill="#16a34a" font-weight="normal" >vertical</text>
<line x1="100" y1="70" x2="210" y2="155" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>
<path d="M65.0,70.0 A35,35 0 0,0 77.5,43.2" fill="none" stroke="#1e293b" stroke-width="1.8"/>
<text x="68" y="90" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >θ</text>
<rect x="40" y="395" width="340" height="35" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" rx="8"/>
<text x="210" y="418" font-size="14" text-anchor="middle" fill="#166534" font-weight="normal" >tan θ = 2a / (5a/4) = 8/5  ⇒  θ ≈ 58.0° ✓</text>
<text x="80" y="65" font-size="13" text-anchor="end" fill="#1e293b" font-weight="normal" >2a</text>
<text x="210" y="435" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Cone suspended from rim of base</text>
