<polygon points="100,70 320,70 210,380" fill="url(#grad-blue)" stroke="#1e293b" stroke-width="3" filter="url(#shadow)"/>
<line x1="100" y1="70" x2="320" y2="70" stroke="#1e293b" stroke-width="3"/>
