<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360" style="background:#ffffff; border-radius:8px;" font-family="system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
  </filter>
  <marker id="ab" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#1e293b"/>
  </marker>
  <marker id="ablue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
  </marker>
  <marker id="ared" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#dc2626"/>
  </marker>
  <marker id="agreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
  </marker>
  <marker id="aorange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
  </marker>
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
  <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>
</defs>
<rect x="40" y="290" width="380" height="35" fill="url(#grad-gray)" stroke="#1e293b" stroke-width="3" filter="url(#shadow-sm)"/>
<text x="230" y="315" font-size="12" text-anchor="middle" fill="#64748b" font-weight="normal" >rough horizontal surface</text>
<line x1="60" y1="290" x2="340" y2="130" stroke="#1e293b" stroke-width="6"/>
<circle cx="60" cy="290" r="7" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="48" y="296" font-size="14" text-anchor="end" fill="#1e293b" font-weight="normal" >B</text>
<circle cx="340" cy="130" r="7" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="348" y="128" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >A</text>
<text x="220" y="200" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >rod: 0.8 m, 6 N</text>
<line x1="340" y1="130" x2="400" y2="70" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ared)"/>
<text x="406" y="66" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold" >P</text>
<path d="M322.3,112.3 A25,25 0 0,0 315.0,130.0" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<text x="310" y="110" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="normal" >45°</text>
<path d="M35.0,290.0 A25,25 0 0,0 38.3,277.5" fill="none" stroke="#1e293b" stroke-width="1.8"/>
<text x="35" y="268" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="normal" >60°</text>
<circle cx="200" cy="210" r="6" fill="#16a34a" stroke="#1e293b" stroke-width="2"/>
<text x="190" y="202" font-size="12" text-anchor="end" fill="#16a34a" font-weight="normal" >CG</text>
<line x1="60" y1="290" x2="35" y2="290" stroke="#2563eb" stroke-width="3.5" marker-end="url(#ablue)"/>
<text x="22" y="288" font-size="14" text-anchor="end" fill="#2563eb" font-weight="normal" >F</text>
<line x1="60" y1="290" x2="60" y2="315" stroke="#16a34a" stroke-width="3.5" marker-end="url(#agreen)"/>
<text x="72" y="315" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="normal" >R</text>
<text x="230" y="355" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Rod hinged with force at angle</text>
</svg>