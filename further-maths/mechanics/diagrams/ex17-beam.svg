<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" style="background:#ffffff; border-radius:8px;" font-family="system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
  </filter>
  <marker id="ab" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#1e293b"/>
  </marker>
  <marker id="ablue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
  </marker>
  <marker id="ared" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#dc2626"/>
  </marker>
  <marker id="agreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
  </marker>
  <marker id="aorange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
  </marker>
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
  <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>
</defs>
<rect x="30" y="30" width="40" height="250" fill="url(#grad-gray)" stroke="#1e293b" stroke-width="3" filter="url(#shadow-sm)"/>
<text x="50" y="160" font-size="13" text-anchor="middle" fill="#64748b" font-weight="normal" >WALL</text>
<line x1="70" y1="190" x2="470" y2="190" stroke="#1e293b" stroke-width="6"/>
<circle cx="70" cy="190" r="9" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="70" y="175" font-size="13" text-anchor="end" fill="#475569" font-weight="normal" >A (hinge)</text>
<line x1="470" y1="190" x2="470" y2="250" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ared)"/>
<rect x="450" y="250" width="40" height="30" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="4" filter="url(#shadow-sm)"/>
<text x="470" y="270" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold" >220 N</text>
<text x="470" y="180" font-size="14" text-anchor="start" fill="#1e293b" font-weight="normal" >B</text>
<line x1="270" y1="190" x2="270" y2="240" stroke="#16a34a" stroke-width="3.5" marker-end="url(#agreen)"/>
<text x="270" y="250" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="normal" >70 N (beam weight)</text>
<line x1="180" y1="190" x2="180" y2="70" stroke="#2563eb" stroke-width="3.5" marker-end="url(#ablue)"/>
<text x="180" y="60" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >T (tension)</text>
<text x="125" y="205" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >0.8 m</text>
<text x="225" y="205" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >1 m</text>
<text x="380" y="205" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >2 m</text>
<line x1="70" y1="170" x2="80" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="80" y1="170" x2="80" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
<text x="270" y="310" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Beam in equilibrium (hinged at wall)</text>
</svg>