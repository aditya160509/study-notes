<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" style="background:#ffffff; border-radius:8px;" font-family="system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
  </filter>
  <marker id="ab" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#1e293b"/>
  </marker>
  <marker id="ablue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
  </marker>
  <marker id="ared" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#dc2626"/>
  </marker>
  <marker id="agreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
  </marker>
  <marker id="aorange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
  </marker>
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
  <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>
</defs>
<line x1="60" y1="200" x2="420" y2="200" stroke="#1e293b" stroke-width="4"/>
<circle cx="60" cy="200" r="8" fill="#1e293b" stroke="#1e293b" stroke-width="2" filter="url(#shadow-sm)"/>
<text x="60" y="225" font-size="13" text-anchor="end" fill="#475569" font-weight="normal" >B (pivot)</text>
<line x1="380" y1="200" x2="420" y2="135" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="380" y1="200" x2="420" y2="135" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ared)"/>
<line x1="380" y1="200" x2="420" y2="200" stroke="#2563eb" stroke-width="2"/>
<line x1="420" y1="135" x2="420" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="410" y1="200" x2="410" y2="190" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="410" y1="190" x2="420" y2="190" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M367.0,200.0 A28,28 0 0,0 369.0,210.5" fill="none" stroke="#1e293b" stroke-width="1.8"/>
<text x="415" y="225" font-size="13" text-anchor="start" fill="#1e293b" font-weight="normal" >θ = 20°</text>
<text x="432" y="155" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold" >3 N</text>
<text x="435" y="195" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="normal" >3 cos 20°</text>
<text x="435" y="212" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="normal" >(perpendicular component)</text>
<text x="410" y="130" font-size="12" text-anchor="middle" fill="#94a3b8" font-weight="normal" >3 sin 20°</text>
<text x="410" y="113" font-size="11" text-anchor="middle" fill="#94a3b8" font-weight="normal" >(parallel — zero moment)</text>
<text x="230" y="190" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >5 m</text>
<text x="250" y="30" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Force at an angle on a rod</text>
<text x="250" y="52" font-size="12" text-anchor="middle" fill="#64748b" font-weight="normal" >Only the perpendicular component produces a moment about B</text>
<rect x="50" y="260" width="400" height="30" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" rx="6"/>
<text x="250" y="280" font-size="12" text-anchor="middle" fill="#991b1b" font-weight="normal" >⚠ The component parallel to the rod passes through B and contributes zero moment.</text>
</svg>