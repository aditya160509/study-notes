<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" style="background:#ffffff; border-radius:8px;" font-family="system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
  </filter>
  <marker id="ab" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#1e293b"/>
  </marker>
  <marker id="ablue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
  </marker>
  <marker id="ared" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#dc2626"/>
  </marker>
  <marker id="agreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
  </marker>
  <marker id="aorange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
  </marker>
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
  <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>
</defs>
<rect x="25" y="20" width="40" height="360" fill="url(#grad-gray)" stroke="#1e293b" stroke-width="3" filter="url(#shadow-sm)"/>
<text x="45" y="60" font-size="12" text-anchor="middle" fill="#64748b" font-weight="normal" >WALL</text>
<polygon points="90,340 90,70 380,340" fill="url(#grad-blue)" stroke="#1e293b" stroke-width="3.5" filter="url(#shadow)"/>
<circle cx="90" cy="340" r="7" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="78" y="348" font-size="14" text-anchor="end" fill="#1e293b" font-weight="normal" >A</text>
<circle cx="90" cy="70" r="8" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="90" y="55" font-size="14" text-anchor="end" fill="#1e293b" font-weight="normal" >B (hinge)</text>
<circle cx="380" cy="340" r="7" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="388" y="348" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >C</text>
<text x="70" y="180" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >15 N</text>
<text x="235" y="355" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >20 N</text>
<text x="230" y="210" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >25 N</text>
<line x1="380" y1="340" x2="440" y2="250" stroke="#2563eb" stroke-width="3" stroke-dasharray="7,4"/>
<text x="408" y="240" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="normal" >string (tension T)</text>
<path d="M358.0,340.0 A22,22 0 0,0 365.0,356.1" fill="none" stroke="#1e293b" stroke-width="1.8"/>
<text x="400" y="320" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="normal" >90°</text>
<text x="235" y="370" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >AC is horizontal</text>
<text x="70" y="145" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >3 m</text>
<text x="135" y="352" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >4 m</text>
<text x="280" y="300" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >5 m</text>
<rect x="120" y="380" width="280" height="30" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5" rx="6"/>
<text x="260" y="400" font-size="13" text-anchor="middle" fill="#92400e" font-weight="normal" >Triangular lamina (60 N) added in part (ii)</text>
<text x="240" y="415" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Triangular frame ABC</text>
</svg>