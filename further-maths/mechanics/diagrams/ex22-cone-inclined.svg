<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" style="background:#ffffff; border-radius:8px;" font-family="system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
  </filter>
  <marker id="ab" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#1e293b"/>
  </marker>
  <marker id="ablue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
  </marker>
  <marker id="ared" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#dc2626"/>
  </marker>
  <marker id="agreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
  </marker>
  <marker id="aorange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
  </marker>
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
  <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>
</defs>
<line x1="40" y1="370" x2="420" y2="110" stroke="#64748b" stroke-width="3"/>
<text x="380" y="105" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >inclined plane</text>
<polygon points="140,260 190,110 240,230" fill="url(#grad-blue)" stroke="#1e293b" stroke-width="3" filter="url(#shadow)"/>
<line x1="140" y1="260" x2="240" y2="230" stroke="#1e293b" stroke-width="3"/>
<circle cx="190" cy="190" r="6" fill="#dc2626" stroke="#1e293b" stroke-width="2"/>
<text x="178" y="182" font-size="13" text-anchor="end" fill="#dc2626" font-weight="normal" >CG</text>
<line x1="190" y1="190" x2="190" y2="245" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="195" y="220" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >r</text>
<line x1="140" y1="260" x2="190" y2="245" stroke="#16a34a" stroke-width="1.5"/>
<text x="160" y="255" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="normal" >r</text>
<circle cx="140" cy="260" r="7" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="128" y="268" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="normal" >O</text>
<path d="M159.8,240.2 A28,28 0 0,0 167.6,255.1" fill="none" stroke="#1e293b" stroke-width="1.8"/>
<text x="155" y="280" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="normal" >θ</text>
<rect x="35" y="310" width="400" height="75" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8" filter="url(#shadow-sm)"/>
<text x="60" y="332" font-size="13" text-anchor="start" fill="#1e293b" font-weight="bold" >μ = 0.5  |  h = 4r</text>
<text x="60" y="352" font-size="12" text-anchor="start" fill="#dc2626" font-weight="normal" >▶ Topple: tan θ = r/r = 1  →  θ = 45°</text>
<text x="60" y="372" font-size="12" text-anchor="start" fill="#16a34a" font-weight="normal" >▶ Slide: tan θ = μ = 0.5  →  θ = 26.6°  ← smaller!</text>
<text x="330" y="372" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold" >∴ Slides first ✓</text>
<text x="230" y="405" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Cone on an inclined plane</text>
</svg>