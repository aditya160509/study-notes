<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" style="background:#ffffff; border-radius:8px;" font-family="system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
  </filter>
  <marker id="ab" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#1e293b"/>
  </marker>
  <marker id="ablue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
  </marker>
  <marker id="ared" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#dc2626"/>
  </marker>
  <marker id="agreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
  </marker>
  <marker id="aorange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
  </marker>
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
  <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>
</defs>
<rect x="60" y="100" width="300" height="180" fill="url(#grad-blue)" stroke="#1e293b" stroke-width="3" filter="url(#shadow-sm)"/>
<text x="200" y="90" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold" >Large: 5a × 3a</text>
<text x="200" y="115" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="normal" >mass = 15a²p</text>
<text x="200" y="135" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="normal" >CG at (2.5a, 1.5a)</text>
<rect x="360" y="140" width="130" height="70" fill="url(#grad-warm)" stroke="#1e293b" stroke-width="3" filter="url(#shadow-sm)"/>
<text x="425" y="130" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold" >Small: 2a × a</text>
<text x="425" y="155" font-size="12" text-anchor="middle" fill="#d97706" font-weight="normal" >mass = 2a²p</text>
<text x="425" y="175" font-size="12" text-anchor="middle" fill="#d97706" font-weight="normal" >CG at (6a, 0.5a)</text>
<circle cx="60" cy="280" r="7" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="60" y="300" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >O (0,0)</text>
<line x1="40" y1="300" x2="510" y2="300" stroke="#1e293b" stroke-width="3.5" marker-end="url(#ab)"/>
<text x="515" y="300" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >x</text>
<line x1="60" y1="320" x2="60" y2="70" stroke="#1e293b" stroke-width="3.5" marker-end="url(#ab)"/>
<text x="60" y="65" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >y</text>
<line x1="60" y1="95" x2="360" y2="95" stroke="#94a3b8" stroke-width="1.2"/>
<text x="210" y="90" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >5a</text>
<line x1="360" y1="135" x2="490" y2="135" stroke="#94a3b8" stroke-width="1.2"/>
<text x="425" y="130" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >2a</text>
<text x="280" y="350" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Composite rectangular lamina</text>
</svg>