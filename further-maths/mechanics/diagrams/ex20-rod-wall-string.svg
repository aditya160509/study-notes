<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" width="440" height="420" style="background:#ffffff; border-radius:8px;" font-family="system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
  </filter>
  <marker id="ab" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#1e293b"/>
  </marker>
  <marker id="ablue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
  </marker>
  <marker id="ared" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#dc2626"/>
  </marker>
  <marker id="agreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
  </marker>
  <marker id="aorange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
  </marker>
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
  <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>
</defs>
<rect x="25" y="20" width="40" height="370" fill="url(#grad-gray)" stroke="#1e293b" stroke-width="3" filter="url(#shadow-sm)"/>
<text x="45" y="100" font-size="11" text-anchor="middle" fill="#64748b" font-weight="normal" >ROUGH</text>
<text x="45" y="115" font-size="11" text-anchor="middle" fill="#64748b" font-weight="normal" >WALL</text>
<line x1="65" y1="370" x2="340" y2="120" stroke="#1e293b" stroke-width="6"/>
<text x="210" y="330" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >rod: mass m, length 2a</text>
<line x1="340" y1="120" x2="65" y2="120" stroke="#2563eb" stroke-width="3" stroke-dasharray="7,4"/>
<text x="210" y="110" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="normal" >string: length 2a</text>
<path d="M318.6,102.0 A28,28 0 0,0 312.0,120.0" fill="none" stroke="#1e293b" stroke-width="1.8"/>
<text x="310" y="97" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="normal" >60°</text>
<line x1="65" y1="250" x2="35" y2="250" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ared)"/>
<text x="22" y="248" font-size="14" text-anchor="end" fill="#dc2626" font-weight="normal" >R</text>
<line x1="65" y1="270" x2="35" y2="295" stroke="#16a34a" stroke-width="3.5" marker-end="url(#agreen)"/>
<text x="22" y="300" font-size="12" text-anchor="end" fill="#16a34a" font-weight="normal" >F (friction)</text>
<line x1="200" y1="245" x2="200" y2="290" stroke="#16a34a" stroke-width="3.5" marker-end="url(#agreen)"/>
<text x="200" y="302" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="normal" >mg</text>
<line x1="340" y1="120" x2="365" y2="108" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ared)"/>
<text x="372" y="106" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal" >T</text>
<circle cx="65" cy="370" r="6" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="65" y="385" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="normal" >B</text>
<circle cx="340" cy="120" r="6" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="340" y="108" font-size="13" text-anchor="end" fill="#1e293b" font-weight="normal" >A</text>
<text x="220" y="410" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Rod against wall with string</text>
</svg>