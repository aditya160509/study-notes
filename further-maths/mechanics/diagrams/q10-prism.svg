<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" style="background:#ffffff; border-radius:8px;" font-family="system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
  </filter>
  <marker id="ab" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#1e293b"/>
  </marker>
  <marker id="ablue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
  </marker>
  <marker id="ared" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#dc2626"/>
  </marker>
  <marker id="agreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
  </marker>
  <marker id="aorange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
  </marker>
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
  <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>
</defs>
<rect x="40" y="310" width="380" height="40" fill="url(#grad-gray)" stroke="#1e293b" stroke-width="3" filter="url(#shadow-sm)"/>
<text x="230" y="338" font-size="12" text-anchor="middle" fill="#64748b" font-weight="normal" >rough horizontal surface</text>
<polygon points="100,310 100,110 360,310" fill="url(#grad-blue)" stroke="#1e293b" stroke-width="3" filter="url(#shadow)"/>
<path d="M100,290 L120,290 L120,310" fill="none" stroke="#64748b" stroke-width="1.5"/>
<text x="110" y="297" font-size="10" text-anchor="middle" fill="#64748b" font-weight="normal" >right angle</text>
<circle cx="100" cy="310" r="7" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="88" y="318" font-size="14" text-anchor="end" fill="#1e293b" font-weight="normal" >O</text>
<circle cx="100" cy="110" r="7" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="100" y="100" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="normal" >top edge</text>
<circle cx="360" cy="310" r="7" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<circle cx="187" cy="243" r="7" fill="#dc2626" stroke="#1e293b" stroke-width="2"/>
<text x="175" y="236" font-size="13" text-anchor="end" fill="#dc2626" font-weight="normal" >CG</text>
<line x1="100" y1="110" x2="70" y2="110" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ared)"/>
<text x="58" y="108" font-size="14" text-anchor="end" fill="#dc2626" font-weight="normal" >X</text>
<line x1="187" y1="243" x2="187" y2="285" stroke="#16a34a" stroke-width="3.5" marker-end="url(#agreen)"/>
<text x="187" y="298" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="normal" >mg</text>
<line x1="360" y1="310" x2="360" y2="335" stroke="#2563eb" stroke-width="3.5" marker-end="url(#ablue)"/>
<text x="368" y="335" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="normal" >R</text>
<line x1="360" y1="310" x2="335" y2="310" stroke="#2563eb" stroke-width="3.5" marker-end="url(#ablue)"/>
<text x="323" y="308" font-size="14" text-anchor="end" fill="#2563eb" font-weight="normal" >F</text>
<text x="80" y="210" font-size="13" text-anchor="end" fill="#1e293b" font-weight="normal" >2a</text>
<text x="110" y="260" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="normal" >a</text>
<rect x="60" y="355" width="380" height="35" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8" filter="url(#shadow-sm)"/>
<text x="250" y="375" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="normal" >Topples when d ≤ 0  |  Slides when X ≥ μmg</text>
<text x="240" y="395" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Triangular prism toppling / sliding</text>
</svg>