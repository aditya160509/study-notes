<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 440" width="460" height="440" style="background:#ffffff; border-radius:8px;" font-family="system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
  </filter>
  <marker id="ab" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#1e293b"/>
  </marker>
  <marker id="ablue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#2563eb"/>
  </marker>
  <marker id="ared" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#dc2626"/>
  </marker>
  <marker id="agreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#16a34a"/>
  </marker>
  <marker id="aorange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,1 L11,6 L0,11 Z" fill="#d97706"/>
  </marker>
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
  <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#e2e8f0"/>
  </linearGradient>
</defs>
<line x1="40" y1="380" x2="430" y2="110" stroke="#64748b" stroke-width="3"/>
<text x="390" y="105" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >rough surface</text>
<polygon points="120,300 180,160 250,180 300,290" fill="url(#grad-blue)" stroke="#1e293b" stroke-width="3" filter="url(#shadow)"/>
<line x1="120" y1="300" x2="300" y2="290" stroke="#1e293b" stroke-width="3"/>
<circle cx="195" cy="230" r="6" fill="#dc2626" stroke="#1e293b" stroke-width="2"/>
<text x="183" y="222" font-size="13" text-anchor="end" fill="#dc2626" font-weight="normal" >CG</text>
<line x1="195" y1="230" x2="195" y2="295" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="202" y="268" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" >h ≈ 1.385r</text>
<line x1="120" y1="300" x2="210" y2="295" stroke="#16a34a" stroke-width="1.5"/>
<text x="160" y="305" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="normal" >r</text>
<circle cx="120" cy="300" r="7" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
<text x="108" y="310" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="normal" >pivot</text>
<path d="M128.6,276.5 A25,25 0 0,0 140.5,285.7" fill="none" stroke="#1e293b" stroke-width="1.8"/>
<text x="133" y="315" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="normal" >θ</text>
<rect x="30" y="350" width="410" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8" filter="url(#shadow-sm)"/>
<text x="50" y="372" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal" >▶ Topple: tan θ = r / 1.385r = 13/18  →  θ ≈ 35.8°</text>
<text x="50" y="392" font-size="13" text-anchor="start" fill="#16a34a" font-weight="normal" >▶ Slide: tan θ = μ = 0.85  →  θ ≈ 40.4°</text>
<text x="340" y="392" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold" >∴ Topples first ✓</text>
<text x="230" y="435" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Frustum toppling</text>
</svg>